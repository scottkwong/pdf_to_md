[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pdf-to-md"
version = "0.4.0"
description = "Convert PDFs to markdown with language, vision, and agentic models."
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "openai>=1.0.0",
    "anthropic>=0.34.0",
    "google-genai>=0.2.0",
    "llama-parse>=0.4.0",
    "pdf2image",
    "Pillow",
    "pycryptodome==3.14.1",
    "pypdf",
    "python-dotenv",
    "reportlab",
    "tenacity",
    "requests>=2.28.0",
    "tqdm",
]

[project.optional-dependencies]
pymupdf = ["pymupdf>=1.24.0"]
local = ["ollama-ocr>=0.1.3"]

[project.scripts]
pdf_to_md = "pdf_to_md:main"

[tool.setuptools.packages.find]
where = ["."]

[tool.setuptools]
data-files = { "share/pdf-to-md" = ["models.json"] }
py-modules = [
    "pdf_to_md",
    "extractors",
    "llm_providers",
    "digital_text_parsers",
    "llamaparse_extractor",
    "local_ocr",
    "benchmark_digital_text_parsers",
    "benchmark_models",
    "models_config",
]

